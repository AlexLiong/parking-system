<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>停车场收费系统 · 管理端</title>
  <link rel="icon" type="image/svg+xml" href="/common/favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!--
    无构建原生 ES 模块单页应用（hash 路由）。
    - 全部脚本以 type="module" 加载，无任何打包器 / CDN / 框架依赖，完全离线可运行；
    - API 同源，绝对路径 /api/...；静态资源相对路径 ./js/...（挂载于 /admin/）。
  -->
  <div id="app" class="app-boot">
    <div class="boot-spinner"><div class="spinner"></div><div>正在加载管理端…</div></div>
  </div>

  <!-- 全局浮层容器（toast / modal 挂载点） -->
  <div id="toasts" class="toasts" aria-live="polite" aria-relevant="additions"></div>
  <div id="modal-root"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
